# thresholds.yaml
# Central configuration for all QA check thresholds and scoring weights.
# Edit values here instead of in individual check modules.

file_checks:
  min_file_size_bytes: 1024
  expected_driver: "GTiff"
  expected_band_count: 3

metadata_checks:
  expected_tile_size: 512
  expected_dtype: "uint16"
  expected_pixel_resolution_m: 10.0
  pixel_resolution_tolerance: 0.01

geospatial_checks:
  expected_crs: "EPSG:32642"
  rotation_tolerance: 1e-6

nodata_check:
  max_zero_fraction: 0.05
  nodata_block_threshold: 0.15

statistics_check:
  min_valid_reflectance: 0
  max_valid_reflectance: 10000
  constant_band_std_threshold: 1.0
  min_dynamic_range: 100.0

saturation_check:
  max_low_fraction: 0.05
  high_saturation_threshold: 10000
  max_high_fraction: 0.02
  line_fraction_threshold: 0.4

blur_check:
  min_laplacian_variance: 100.0

noise_check:
  # KNOWN LIMITATION: calibrated on only one paired clean/noisy sample.
  # Batch run on full dataset (55 files) showed frequent false positives.
  # Candidate for re-calibration if more noisy samples are generated.
  max_noise_sigma: 4.2

blackline_check:
  # KNOWN LIMITATION: not yet tested against a dedicated striping defect.
  low_std_ratio: 0.15

cloud_check:
  max_cloud_fraction: 0.20
  max_shadow_fraction: 0.15
  max_scl_bad_fraction: 0.05

anomaly_check:
  # KNOWN LIMITATION: median+MAD still degrades with large (~25%+) area
  # anomalies. Batch run showed heavy false-positive rate on scene1 tiles
  # (z-scores up to 30), suggesting this threshold needs recalibration
  # against a larger, more representative sample -- or this check should
  # be scoped to only flag SMALL localized anomalies, which is its
  # original intended use case.
  grid_size: 8
  z_threshold: 3.5

scoring:
  min_passing_score: 60.0
  weights:
    dtype: 5
    pixel_resolution: 8
    square_pixels: 5
    driver_check: 5
    value_range: 8
    low_contrast: 10
    low_saturation: 8
    high_saturation: 8
    blur_check: 15
    noise_check: 10
    striping_check: 12
    nodata_spatial_pattern: 10
    cloud_coverage: 12
    shadow_coverage: 8
    default_weight: 5